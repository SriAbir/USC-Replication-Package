# USC study: reported hardware and software environment
# Source: Section 5.1.2 and Table 4 supplied by the authors.
# These are documented settings, not an executable deployment configuration.

study:
  framework_roles:
    - Designer
    - Programmer
  agent_pair_configurations: 19
  original_programming_problems: 7
  compiler_conditions:
    - with_compiler_agent
    - without_compiler_agent
  compiler_agent_model_rule: "Same model as Programmer Agent when enabled"

software:
  python_version: "3.10.12"
  compiler:
    name: GCC
    version: "11.4.0"
  local_model_serving:
    platform: Ollama Server
    version: "0.12.10"
    usage: "Open-source models"
  api_model_access:
    example: "OpenAI GPT-4 series via Python SDK"
  orchestration_language: Python

hardware:
  - server: Server-1
    operating_system: Windows
    processor: "AMD Ryzen 9 9950X"
    ram_gb: 128
    vram_gb: 32
    gpu: "NVIDIA 5090"
  - server: Server-2
    operating_system: Windows
    processor: "AMD Ryzen 9 7950X3D"
    ram_gb: 128
    vram_gb: 48
    gpu: "NVIDIA A6000"
  - server: Server-3
    operating_system: Windows
    processor: "Intel Core 9 285"
    ram_gb: 128
    vram_gb: 24
    gpu: "NVIDIA A6000"
  - server: Server-4
    operating_system: Linux
    processor: "NVIDIA GB 10"
    ram_gb: 128
    vram_description: "128 GB (Unified Memory)"
    gpu: "GB 10 NVIDIA"

notes:
  - "Hardware and software values transcribed from the supplied manuscript excerpt."
  - "The eight-problem and 19-pair figures describe the original framework experiment, not the seven-task, 40-conversation USC analysis subset."
  - "Sampling parameters, seeds, and model-to-server allocation were not specified in the supplied excerpt."
